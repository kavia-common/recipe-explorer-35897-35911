<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In - 11-235</title>
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./sign-in-11-235.css">
</head>
<body>
  <div class="screen-container" id="screen-11-235">
    <!-- Status Bar (component_ref: property_1_light_mode) -->
    <div class="abs status-bar" style="left: 0px; top: 0px; width: 375px; height: 44px;">
      <!-- Symbols frame -->
      <div class="abs" style="left: 293.5px; top: 16.6px; width: 68px; height: 13px;">
        <!-- Battery group -->
        <div class="abs" style="left: 42.5px; top: 16.84px; width: 24.5px; height: 11.5px;">
          <!-- Rectangle boolean group (visual via inner paths) -->
          <div class="abs" style="left: 0px; top: 0px; width: 24.5px; height: 11.5px; opacity: 0.4; background: var(--color-303030);"></div>
          <!-- Inner paths as svg images where provided -->
          <img class="abs icon-img" alt="Battery Path" src="figmaimages/figma_image_13_71_128_306.svg" style="left: 1px; top: 1px; width: 20px; height: 9.5px;">
          <img class="abs icon-img" alt="Battery Path" src="figmaimages/figma_image_13_71_128_307.svg" style="left: 0px; top: 0px; width: 22px; height: 11.5px;">
          <!-- Right notch -->
          <div class="abs" style="left: 23px; top: 3.69px; width: 1.5px; height: 4px; background: var(--color-000000);"></div>
          <!-- Fill rectangle -->
          <img class="abs icon-img" alt="Battery Fill" src="figmaimages/figma_image_13_71_128_309.svg" style="left: 2px; top: 1.92px; width: 18px; height: 7.6667px;">
        </div>
        <!-- Combined Shape (signal bars) -->
        <div class="abs" style="left: 0px; top: 1px; width: 17.1px; height: 10.7px; background: var(--color-303030);">
          <img class="abs icon-img" alt="Bar1" src="figmaimages/figma_image_13_71_128_311.svg" style="left: 0px; top: 6.7px; width: 3px; height: 4px;">
          <img class="abs icon-img" alt="Bar2" src="figmaimages/figma_image_13_71_128_312.svg" style="left: 4.8px; top: 4.7px; width: 3px; height: 6px;">
          <img class="abs icon-img" alt="Bar3" src="figmaimages/figma_image_13_71_128_313.svg" style="left: 9.4px; top: 0px; width: 3px; height: 8.3px;">
          <img class="abs icon-img" alt="Bar4" src="figmaimages/figma_image_13_71_128_314.svg" style="left: 14.1px; top: 0px; width: 3px; height: 10.7px;">
        </div>
        <!-- Wi-Fi boolean (using simple placeholders for strokes) -->
        <div class="abs" style="left: 22.1px; top: 0px; width: 15.4px; height: 11.0572px; background: var(--color-303030);"></div>
      </div>
      <!-- Time -->
      <div class="abs" style="left: 0px; top: 12px; width: 180px; height: 22px;">
        <span class="text" style="left: 29.5px; top: 2px; position: absolute; font-family: var(--typo-67-family); font-size: var(--typo-67-size); font-weight: var(--typo-67-weight); line-height: var(--typo-67-line-height); letter-spacing: var(--typo-67-letter-spacing); color: var(--typo-67-color);">19:27</span>
      </div>
    </div>

    <!-- Title group -->
    <div class="abs" style="left: 30px; top: 94px; width: 155px; height: 75px;">
      <span class="text" style="position: absolute; left: 0px; top: 0px; width: 84px; height: 45px; font-family: var(--typo-60-family); font-size: var(--typo-60-size); font-weight: var(--typo-60-weight); line-height: var(--typo-60-line-height); letter-spacing: var(--typo-60-letter-spacing); color: var(--typo-60-color);">Hello,</span>
      <span class="text" style="position: absolute; left: 0px; top: 45px; width: 155px; height: 30px; font-family: var(--typo-61-family); font-size: var(--typo-61-size); font-weight: var(--typo-61-weight); line-height: var(--typo-61-line-height); letter-spacing: var(--typo-61-letter-spacing); color: var(--typo-61-color);">Welcome Back!</span>
    </div>

    <!-- Input field: Email -->
    <div class="abs" style="left: 30px; top: 226px; width: 315px; height: 81px;">
      <div class="abs" style="left: 0px; top: 26px; width: 315px; height: 55px; background: var(--color-ffffff); border: var(--style-30-border-width) solid var(--style-30-border-color); border-radius: var(--style-30-radius);"></div>
      <span class="text" style="position: absolute; left: 20px; top: 45px; width: 61px; height: 17px; font-family: var(--typo-65-family); font-size: var(--typo-65-size); font-weight: var(--typo-65-weight); line-height: var(--typo-65-line-height); letter-spacing: var(--typo-65-letter-spacing); color: var(--typo-65-color);">Enter Email</span>
      <span class="text" style="position: absolute; left: 0px; top: 0px; width: 38px; height: 21px; font-family: var(--typo-66-family); font-size: var(--typo-66-size); font-weight: var(--typo-66-weight); line-height: var(--typo-66-line-height); letter-spacing: var(--typo-66-letter-spacing); color: var(--typo-66-color);">Email</span>
    </div>

    <!-- Input field: Password -->
    <div class="abs" style="left: 30px; top: 337px; width: 315px; height: 81px;">
      <div class="abs" style="left: 0px; top: 26px; width: 315px; height: 55px; background: var(--color-ffffff); border: var(--style-30-border-width) solid var(--style-30-border-color); border-radius: var(--style-30-radius);"></div>
      <span class="text" style="position: absolute; left: 20px; top: 45px; width: 84px; height: 17px; font-family: var(--typo-65-family); font-size: var(--typo-65-size); font-weight: var(--typo-65-weight); line-height: var(--typo-65-line-height); letter-spacing: var(--typo-65-letter-spacing); color: var(--typo-65-color);">Enter Password</span>
      <span class="text" style="position: absolute; left: 0px; top: 0px; width: 107px; height: 21px; font-family: var(--typo-66-family); font-size: var(--typo-66-size); font-weight: var(--typo-66-weight); line-height: var(--typo-66-line-height); letter-spacing: var(--typo-66-letter-spacing); color: var(--typo-66-color);">Enter Password</span>
    </div>

    <!-- Forgot Password -->
    <div class="abs" style="left: 40px; top: 438px; width: 97px; height: 17px;">
      <span class="text" style="position:absolute; left:0; top:0; width:97px; height:17px; font-family: var(--typo-62-family); font-size: var(--typo-62-size); font-weight: var(--typo-62-weight); line-height: var(--typo-62-line-height); letter-spacing: var(--typo-62-letter-spacing); color: var(--typo-62-color);">Forgot Password?</span>
    </div>

    <!-- Big Button -->
    <div class="abs" style="left: 30px; top: 480px; width: 315px; height: 60px; background: var(--style-11-bg); border-radius: var(--style-11-radius);">
      <span class="text" style="position:absolute; left: 85px; top: 18px; width: 114px; height: 24px; font-family: var(--typo-58-family); font-size: var(--typo-58-size); font-weight: var(--typo-58-weight); line-height: var(--typo-58-line-height); letter-spacing: var(--typo-58-letter-spacing); color: var(--typo-58-color); text-align: var(--typo-58-text-align);">Sign In</span>
      <!-- Arrow icon instance -->
      <img class="abs icon-img" alt="Arrow Right" src="figmaimages/figma_image_54_668_53_625.svg" style="left: 210px; top: 20px; width: 20px; height: 20px;">
    </div>

    <!-- Divider Line group -->
    <div class="abs" style="left: 90px; top: 560px; width: 195px; height: 17px;">
      <div class="abs line" style="left: 145px; top: 9px; width: 50px;"></div>
      <div class="abs line" style="left: 0px; top: 9px; width: 50px;"></div>
      <span class="text" style="position:absolute; left: 57px; top: 0px; width: 81px; height: 17px; font-family: var(--typo-64-family); font-size: var(--typo-64-size); font-weight: var(--typo-64-weight); line-height: var(--typo-64-line-height); letter-spacing: var(--typo-64-letter-spacing); color: var(--typo-64-color);">Or Sign in With</span>
    </div>

    <!-- Social Button: Google -->
    <div class="abs" style="left: 131px; top: 597px; width: 44px; height: 44px;">
      <div class="abs shadow-0" style="left:0; top:0; width:44px; height:44px; background: var(--style-126-bg); border-radius: var(--style-126-radius);"></div>
      <!-- Google icon vector as provided -->
      <img class="abs icon-img" alt="Google icon Vector" src="figmaimages/figma_image_13_39.svg" style="left: 12px; top: 12px; width: 20px; height: 20px;">
      <img class="abs icon-img" alt="Google icon Vector" src="figmaimages/figma_image_13_42.svg" style="left: 22px; top: 20px; width: 10px; height: 9.4141px;">
    </div>

    <!-- Social Button: Facebook -->
    <div class="abs" style="left: 200px; top: 597px; width: 44px; height: 44px;">
      <div class="abs shadow-0" style="left:0; top:0; width:44px; height:44px; background: var(--style-126-bg); border-radius: var(--style-126-radius);"></div>
      <img class="abs icon-img" alt="Facebook icon Vector" src="figmaimages/figma_image_13_58.svg" style="left: 12px; top: 12px; width: 20px; height: 20px;">
    </div>

    <!-- CTA to Sign up -->
    <span class="abs text" style="left: 99px; top: 696px; width: 177px; height: 17px; font-family: var(--typo-63-family); font-size: var(--typo-63-size); font-weight: var(--typo-63-weight); line-height: var(--typo-63-line-height); letter-spacing: var(--typo-63-letter-spacing); color: var(--typo-63-color);">Don’t have an account? Sign up</span>

    <!-- Home Indicator -->
    <div class="abs" style="left: 0px; top: 778px; width: 375px; height: 34px;">
      <div class="abs" style="left: 120px; top: 21px; width: 135px; height: 5px; background: var(--style-32-bg); border-radius: var(--style-32-radius);"></div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script src="./sign-in-11-235.js"></script>
</body>
</html>
